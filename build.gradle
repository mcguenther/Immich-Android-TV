plugins {
    alias libs.plugins.android.application apply false
    alias libs.plugins.android.library apply false
    alias libs.plugins.kotlin.android apply false
    alias libs.plugins.navigation.safeargs.kotlin apply false
    alias libs.plugins.diffplug.spotless apply false
    alias libs.plugins.google.devtools.ksp apply false
    alias libs.plugins.google.firebase.crashlytics apply false
    alias libs.plugins.google.gms.google.services apply false
}

allprojects {
    repositories {
        google()
        mavenCentral()
        maven { url 'https://jitpack.io' }
    }
}

subprojects {
    apply plugin: "com.diffplug.spotless"
    spotless {
        // Don't fail `./gradlew check` on Spotless: licenseHeaderFile pointed at a never-committed
        // copyright.kt, and ktlint aborts on many existing sources.
        enforceCheck false
        kotlin {
            target("**/*.kt")
            // Spotless 7+ removed userData(); rules are configured via editorConfigOverride.
            ktlint().editorConfigOverride(["ktlint_standard_max-line-length": "disabled"])
        }
    }

    tasks.configureEach {
        if (name == "preBuild") {
            mustRunAfter("spotlessCheck")
        }
    }
}
